name: Publish macOS Release
on:
  push:
    branches: [main]
    paths: ['desktop/Version.props']
  workflow_dispatch:
permissions:
  contents: read
env:
  MACOS_DEVELOPER_TEAM_ID: AXBYDPHN88
concurrency:
  group: xiaoheihe-macos-release
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/scripts/release/release.py detect
  tests:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - run: dotnet restore desktop/HeyRead.slnx --locked-mode
      - run: dotnet test desktop/tests/HeyRead.Tests -c Release --no-restore --logger trx --results-directory desktop/TestResults
      - run: python3 -m unittest discover -s desktop/scripts/release -p 'test_*.py' -v
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-tests
          path: desktop/TestResults
  package:
    needs: [version, tests]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            arch: arm64
          - rid: osx-x64
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - name: Configure Developer ID signing and Apple notarization
        env:
          CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Missing MACOS_DEVELOPER_ID_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARY_KEY:?Missing MACOS_NOTARY_KEY}"
          : "${NOTARY_KEY_ID:?Missing MACOS_NOTARY_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing MACOS_NOTARY_ISSUER_ID}"
          umask 077
          keychain="$RUNNER_TEMP/heyread-release.keychain-db"
          certificate="$RUNNER_TEMP/heyread-certificate.p12"
          notary_key="$RUNNER_TEMP/heyread-notary.p8"
          probe="$RUNNER_TEMP/heyread-signing-probe"
          trap 'rm -f "$certificate" "$notary_key" "$probe"' EXIT
          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate"
          printf '%s\n' "$NOTARY_KEY" > "$notary_key"

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="$MACOS_DEVELOPER_TEAM_ID" '/"Developer ID Application:/ && index($0, "(" team ")") {print $2}')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || { echo 'Expected one valid Developer ID Application identity for this team' >&2; exit 1; }
          cp /usr/bin/true "$probe"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$probe"
          codesign --verify --strict "$probe"
          xcrun notarytool store-credentials heyread-release --keychain "$keychain" \
            --key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          {
            printf 'XIAOHEIHE_SIGN_KEYCHAIN=%s\n' "$keychain"
            printf 'XIAOHEIHE_SIGN_IDENTITY=%s\n' "$identity"
            printf 'XIAOHEIHE_NOTARY_PROFILE=heyread-release\n'
          } >> "$GITHUB_ENV"
      - name: Package, sign and notarize the app and installer
        run: desktop/scripts/package-macos.sh '${{ matrix.rid }}'
      - name: Verify Developer ID, notarization and architecture
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/verify-update"
          mkdir -p "$verify"
          ditto -x -k "desktop/artifacts/xiaoheihe-community-formac-$VERSION-$RID.zip" "$verify"
          app="$verify/xiaoheihe-community-formac.app"
          dmg="desktop/artifacts/xiaoheihe-community-formac-$VERSION-$RID.dmg"
          requirement="=anchor apple generic and certificate leaf[subject.OU] = \"$MACOS_DEVELOPER_TEAM_ID\" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists"
          codesign --verify --deep --strict -R "$requirement" "$app"
          codesign --verify --strict -R "$requirement" "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          lipo "$app/Contents/MacOS/xiaoheihe-community-formac" -verify_arch "$ARCH"
          lipo "$app/Contents/MacOS/libHeyReadNative.dylib" -verify_arch "$ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.3egirlsdream.xiaoheihe-community-formac
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          if [ "$RID" = osx-x64 ]; then "$app/Contents/MacOS/xiaoheihe-community-formac" --version; fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.rid }}
          path: |
            desktop/artifacts/*.zip
            desktop/artifacts/*.dmg
          if-no-files-found: error
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/heyread-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
  publish:
    needs: [version, tests, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-osx-*
          path: dist
          merge-multiple: true
      - name: Sign and verify the update manifest
        env:
          SIGNING_KEY: ${{ secrets.MACOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python3 desktop/scripts/release/release.py manifest --directory dist --key "$key"
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish a complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Refusing to replace a published release"' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "小黑盒Community For Mac $VERSION" --notes-file desktop/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets > release-result.json
          python3 - "$VERSION" <<'PY'
          import json,sys
          r=json.load(open('release-result.json'));v=sys.argv[1]
          expected={f'xiaoheihe-community-formac-{v}-{rid}.{ext}' for rid in ('osx-arm64','osx-x64') for ext in ('zip','dmg')}|{'update-manifest.json','update-manifest.sig','SHA256SUMS.txt'}
          assert not r['isDraft']
          assert expected == {a['name'] for a in r['assets']}
          print(r['url'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: published-release-result
          path: release-result.json
