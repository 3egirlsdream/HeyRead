name: Publish macOS Release
on:
  push:
    branches: [main]
    paths: ['desktop/Version.props']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xiaoheihe-macos-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.detect.outputs.publish }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 desktop/scripts/release/release.py detect
  tests:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - run: dotnet restore desktop/HeyRead.slnx --locked-mode
      - run: dotnet test desktop/tests/HeyRead.Tests -c Release --no-restore --logger trx --results-directory desktop/TestResults
      - run: python3 -m unittest discover -s desktop/scripts/release -p 'test_*.py' -v
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-tests
          path: desktop/TestResults
  package:
    needs: [version, tests]
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - name: Package app, signed bundle, DMG and update ZIP
        run: desktop/scripts/package-macos.sh '${{ matrix.rid }}'
      - name: Verify update archive and architecture
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/verify-update"
          mkdir -p "$verify"
          ditto -x -k "desktop/artifacts/xiaoheihe-community-formac-$VERSION-$RID.zip" "$verify"
          app="$verify/xiaoheihe-community-formac.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.3egirlsdream.xiaoheihe-community-formac
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          if [ "$RID" = osx-x64 ]; then "$app/Contents/MacOS/xiaoheihe-community-formac" --version; fi
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.rid }}
          path: |
            desktop/artifacts/*.zip
            desktop/artifacts/*.dmg
          if-no-files-found: error
  publish:
    needs: [version, tests, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-osx-*
          path: dist
          merge-multiple: true
      - name: Sign and verify the update manifest
        env:
          SIGNING_KEY: ${{ secrets.MACOS_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          python3 desktop/scripts/release/release.py manifest --directory dist --key "$key"
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish a complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Refusing to replace a published release"' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "小黑盒Community For Mac $VERSION" --notes-file desktop/RELEASE-NOTES.md
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets > release-result.json
          python3 - "$VERSION" <<'PY'
          import json,sys
          r=json.load(open('release-result.json'));v=sys.argv[1]
          expected={f'xiaoheihe-community-formac-{v}-{rid}.{ext}' for rid in ('osx-arm64','osx-x64') for ext in ('zip','dmg')}|{'update-manifest.json','update-manifest.sig','SHA256SUMS.txt'}
          assert not r['isDraft']
          assert expected == {a['name'] for a in r['assets']}
          print(r['url'])
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: published-release-result
          path: release-result.json
