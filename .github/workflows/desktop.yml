name: macOS desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - name: Restore locked dependencies
        run: dotnet restore HeyRead.slnx --locked-mode
      - name: Test desktop protocols and UI
        run: dotnet test tests/HeyRead.Tests --no-restore -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-test-results
          path: desktop/TestResults
  package:
    needs: desktop-tests
    runs-on: macos-15-intel
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: desktop/global.json
      - run: ./scripts/package-macos.sh '${{ matrix.rid }}'
      - name: Start the Intel self-contained runtime
        if: matrix.rid == 'osx-x64'
        run: ./artifacts/osx-x64/xiaoheihe-community-formac.app/Contents/MacOS/xiaoheihe-community-formac --version
      - uses: actions/upload-artifact@v6
        with:
          name: xiaoheihe-community-formac-${{ matrix.rid }}
          path: desktop/artifacts/*.dmg
          retention-days: 14
